name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Shared workflow policy
    uses: yaron-E92/AutoDev/.github/workflows/profile-baseline.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      require_concurrency: true
    permissions:
      contents: read

  version-intent:
    name: Version intent
    if: github.event_name == 'pull_request'
    uses: yaron-E92/AutoDev/.github/workflows/version-intent.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      pr_body: ${{ github.event.pull_request.body }}
      head: ${{ github.sha }}
    permissions:
      contents: read

  backend:
    name: Backend .NET validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-dotnet.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      runner: windows-latest
      global_json_file: ''
      dotnet_version: '10.0.x'
      setup_command: bash scripts/ci-configure-nuget.sh
      restore_command: dotnet restore backend/SurvivalGarden.Api.Tests/SurvivalGarden.Api.Tests.csproj
      build_command: dotnet build backend/SurvivalGarden.Api.Tests/SurvivalGarden.Api.Tests.csproj --configuration Debug --no-restore
      test_command: |
        set -euo pipefail
        mkdir -p artifacts/ci/backend
        dotnet test backend/SurvivalGarden.Api.Tests/SurvivalGarden.Api.Tests.csproj \
          --configuration Debug \
          --no-build \
          --no-restore \
          --logger 'trx;LogFileName=backend.trx' \
          --results-directory artifacts/ci/backend \
          --verbosity normal
        dotnet test backend/SurvivalGarden.Api.Tests/SurvivalGarden.Api.Tests.csproj \
          --configuration Debug \
          --no-build \
          --no-restore \
          --filter 'FullyQualifiedName~ApiContractRouteOwnershipTests' \
          --logger 'trx;LogFileName=route-ownership.trx' \
          --results-directory artifacts/ci/backend \
          --verbosity normal
      test_results_path: artifacts/ci/backend/*.trx
      artifact_name: survivalgarden-backend-results
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

  frontend:
    name: Frontend Node validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-node-next.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      node_version: '20.19.x'
      working_directory: frontend
      cache: false
      package_manager: pnpm
      setup_command: corepack enable && corepack prepare pnpm@9 --activate
      install_command: pnpm install
      lint_command: pnpm lint
      typecheck_command: pnpm typecheck
      test_command: pnpm test
      build_command: pnpm build
      artifact_name: survivalgarden-frontend
      artifact_path: frontend/dist
    permissions:
      contents: read

  contracts:
    name: Backend ↔ frontend contract drift
    needs: [baseline, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NUGET_AUTH_TOKEN: ${{ github.token }}
      CONTRACTS__VERSION: '1.0.0'
      CONTRACTS__PERSISTEDSCHEMAVERSION: '2'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.x

      - name: Configure package managers
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-configure-nuget.sh
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --dir frontend install

      - name: Build backend API
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend/SurvivalGarden.Api/SurvivalGarden.Api.csproj
          dotnet build backend/SurvivalGarden.Api/SurvivalGarden.Api.csproj --configuration Debug --no-restore

      - name: Verify generated frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/contracts
          dotnet run \
            --project backend/SurvivalGarden.Api/SurvivalGarden.Api.csproj \
            --configuration Debug \
            --no-build \
            --urls http://127.0.0.1:5142 \
            >artifacts/ci/contracts/api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:5142/openapi/v1.json \
              --output artifacts/ci/contracts/openapi-v1.json; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != 'true' ]]; then
            cat artifacts/ci/contracts/api.log >&2
            echo 'Backend OpenAPI endpoint did not become ready in time.' >&2
            exit 1
          fi

          export BACKEND_OPENAPI_URL='http://127.0.0.1:5142/openapi/v1.json'
          export REQUIRE_BACKEND_OPENAPI=1
          export EXPECTED_CONTRACT_VERSION='1.0.0'
          pnpm --dir frontend gen:types

          if ! git diff --exit-code -- \
            frontend/src/generated/contracts.ts \
            frontend/src/generated/openapi-paths.ts \
            frontend/src/generated/api-client.ts; then
            echo 'Generated frontend API contracts are stale. Regenerate and commit frontend/src/generated/*.' >&2
            exit 1
          fi

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: survivalgarden-contract-evidence
          path: artifacts/ci/contracts
          if-no-files-found: error
          retention-days: 14

  maui:
    name: MAUI product validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-maui.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      ref: ${{ github.sha }}
      global_json_file: ''
      dotnet_version: '10.0.x'
      headless_enabled: false

      android_enabled: true
      android_runner: ubuntu-latest
      android_setup_command: |
        set -euo pipefail
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-android --skip-manifest-update
      android_restore_command: dotnet restore backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj /p:EnableMauiTargets=true
      android_build_command: dotnet build backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj --configuration Debug --framework net10.0-android --no-restore /p:EnableMauiTargets=true
      android_test_command: find backend/SurvivalGarden.Maui/bin/Debug/net10.0-android -type f -name 'SurvivalGarden.Maui.dll' -print -quit | grep -q .

      windows_enabled: true
      windows_runner: windows-latest
      windows_setup_command: |
        set -euo pipefail
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-windows --skip-manifest-update
      windows_restore_command: dotnet restore backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj /p:EnableMauiTargets=true /p:WindowsPackageType=None
      windows_build_command: dotnet build backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj --configuration Debug --framework net10.0-windows10.0.19041.0 --no-restore /p:EnableMauiTargets=true /p:WindowsPackageType=None /p:UseMonoRuntime=false
      windows_test_command: find backend/SurvivalGarden.Maui/bin/Debug/net10.0-windows10.0.19041.0 -type f -name 'SurvivalGarden.Maui.dll' -print -quit | grep -q .
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

  ci-gate:
    name: CI gate
    if: always()
    needs: [baseline, version-intent, backend, frontend, contracts, maui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require version policy and product validation
        shell: bash
        env:
          BASELINE: ${{ needs.baseline.result }}
          VERSION_INTENT: ${{ needs.version-intent.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          MAUI: ${{ needs.maui.result }}
        run: |
          set -euo pipefail
          if [[ "$BASELINE" != 'success' ||
                "$BACKEND" != 'success' ||
                "$FRONTEND" != 'success' ||
                "$CONTRACTS" != 'success' ||
                "$MAUI" != 'success' ]]; then
            echo "Required CI failed: baseline=$BASELINE backend=$BACKEND frontend=$FRONTEND contracts=$CONTRACTS maui=$MAUI" >&2
            exit 1
          fi

          if [[ "$VERSION_INTENT" != 'success' && "$VERSION_INTENT" != 'skipped' ]]; then
            echo "Version intent validation failed: $VERSION_INTENT" >&2
            exit 1
          fi

          echo 'SurvivalGarden authoritative CI passed.'

  version-tag:
    name: Advance version tag
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    uses: yaron-E92/AutoDev/.github/workflows/version-tag.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      head: ${{ github.sha }}
      branch: main
    permissions:
      contents: write
      pull-requests: read
