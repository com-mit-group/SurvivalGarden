name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (for example, 1.0.0). Leave empty to use the tag this workflow runs on."
        type: string
        required: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      build-status: ${{ steps.build-status.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: set-version
        shell: pwsh
        run: |
          $manualVersion = "${{ github.event.inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($manualVersion)) {
            $version = $manualVersion.Trim()
            Write-Host "Using manual version: $version"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}"
            Write-Host "Using tag version: $version"
          } else {
            throw "Version input is required when the workflow is not run from a tag."
          }

          if ($version -match '^v(?<semver>[0-9]+\.[0-9]+\.[0-9]+)$') {
            $version = $Matches.semver
            Write-Host "Normalized leading-v tag/input to: $version"
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Semantic version '$version' must contain numeric major, minor, and patch segments."
          }

          $parts = $version.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $majorLimit = 2147
          $minorLimit = 483
          $patchLimit = 647
          if ($major -gt $majorLimit -or $minor -gt $minorLimit -or $patch -gt $patchLimit) {
            throw "Semantic version '$version' exceeds Android version code limits (major <= $majorLimit, minor <= $minorLimit, patch <= $patchLimit)."
          }

          $androidVersionCode = ($major * 1000000) + ($minor * 1000) + $patch
          $sha = "${{ github.sha }}"
          $assemblySemFileVer = "$version.0"
          $informationalVersion = if ([string]::IsNullOrWhiteSpace($sha)) { $version } else { "$version+$($sha.Substring(0, 7))" }

          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          Set-Content -Path ./artifacts/VERSION.txt -Value $version

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "android_version_code=$androidVersionCode" >> $env:GITHUB_OUTPUT
          echo "assembly_sem_file_ver=$assemblySemFileVer" >> $env:GITHUB_OUTPUT
          echo "informational_version=$informationalVersion" >> $env:GITHUB_OUTPUT
          echo "VersionPrefix=$version" >> $env:GITHUB_ENV
          echo "AndroidVersionCode=$androidVersionCode" >> $env:GITHUB_ENV

      - name: Check for existing build artifacts
        id: check-artifacts
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $version = "${{ steps.set-version.outputs.version }}"
          $expected = @(
            "build-$version-windows-unsigned",
            "build-$version-android-unsigned",
            "build-$version-metadata"
          )

          $response = gh api "repos/$repo/actions/artifacts?per_page=100" | ConvertFrom-Json
          $artifacts = @()
          if ($null -ne $response.artifacts) { $artifacts = @($response.artifacts) }

          $existing = $artifacts |
            Where-Object { $_.name -in $expected -and $_.expired -eq $false } |
            Select-Object -ExpandProperty name -Unique

          if ($existing.Count -eq $expected.Count) {
            Write-Host "Build artifacts already exist for version $version"
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No complete build artifact set found for version $version. Proceeding with build."
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set up .NET 10 SDK
        if: steps.check-artifacts.outputs.exists == 'false'
        id: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore cached .NET workloads
        if: steps.check-artifacts.outputs.exists == 'false'
        id: restore-dotnet-workloads
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Program Files\dotnet\packs
            C:\Program Files\dotnet\sdk-manifests
            C:\ProgramData\dotnet\workload*
            C:\Program Files\dotnet\metadata
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-
            ${{ runner.os }}-dotnet-

      - name: Restore cached Android SDK
        if: steps.check-artifacts.outputs.exists == 'false'
        id: restore-android-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install MAUI workload
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        run: dotnet workload install maui --skip-manifest-update

      - name: Install Android SDK components
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-android-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "tools"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install Android SDK components"
            exit 1
          }

      - name: Save .NET workloads cache
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-dotnet-workloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\Program Files\dotnet\packs
            C:\Program Files\dotnet\sdk-manifests
            C:\ProgramData\dotnet\workload*
            C:\Program Files\dotnet\metadata
          key: ${{ runner.os }}-dotnet-${{ steps.setup-dotnet.outputs.dotnet-version }}-${{ hashFiles('**/global.json') }}

      - name: Save Android SDK cache
        if: steps.check-artifacts.outputs.exists == 'false' && steps.restore-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ${{ env.ANDROID_SDK_ROOT }}
            C:\Users\runneradmin\.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/global.json') }}

      - name: Ensure GitHub NuGet Source
        if: steps.check-artifacts.outputs.exists == 'false'
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ secrets.YARE92_NUGET_TOKEN_EXP_17JUN2026 }}
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/yaron-E92/index.json `
            -n github `
            -u Yaron-E92 `
            -p $env:NUGET_TOKEN `
            --store-password-in-clear-text

      - name: Restore Windows MAUI target
        if: steps.check-artifacts.outputs.exists == 'false'
        run: >-
          dotnet restore backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj
          -r win-x64
          /p:EnableMauiTargets=true
          /p:WindowsPackageType=None
          /p:UseMonoRuntime=false
          /p:PublishReadyToRun=true

      - name: Build Windows executable
        if: steps.check-artifacts.outputs.exists == 'false'
        run: >-
          dotnet publish backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -f net10.0-windows10.0.19041.0
          -o ./artifacts/win
          /p:EnableMauiTargets=true
          /p:WindowsPackageType=None
          /p:UseMonoRuntime=false
          /p:AssemblyVersion=${{ steps.set-version.outputs.assembly_sem_file_ver }}
          /p:FileVersion=${{ steps.set-version.outputs.assembly_sem_file_ver }}
          /p:InformationalVersion=${{ steps.set-version.outputs.informational_version }}

      - name: Restore Android MAUI target
        if: steps.check-artifacts.outputs.exists == 'false'
        run: >-
          dotnet restore backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj
          /p:EnableMauiTargets=true

      - name: Build Android APK
        if: steps.check-artifacts.outputs.exists == 'false'
        run: >-
          dotnet publish backend/SurvivalGarden.Maui/SurvivalGarden.Maui.csproj
          -c Release
          --no-restore
          -f net10.0-android
          -o ./artifacts/android
          /p:EnableMauiTargets=true
          /p:AndroidPackageFormat=apk
          /p:ApplicationVersion=${{ steps.set-version.outputs.android_version_code }}
          /p:ApplicationDisplayVersion=${{ steps.set-version.outputs.version }}

      - name: Normalize artifact names
        if: steps.check-artifacts.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.set-version.outputs.version }}"

          $winOutput = Get-ChildItem 'artifacts/win' -Filter *.exe -Recurse |
            Where-Object { $_.Name -notlike 'createdump.exe' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $winOutput) { throw 'Windows publish output missing expected .exe file.' }
          $winName = "SurvivalGarden-$version-unsigned.exe"
          Rename-Item -Path $winOutput.FullName -NewName $winName -Force
          Write-Host "Renamed Windows artifact to: $winName"

          $apkOutput = Get-ChildItem 'artifacts/android' -Filter *.apk -Recurse |
            Where-Object { $_.Name -notmatch '-Signed\.apk$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $apkOutput) {
            $apkOutput = Get-ChildItem 'artifacts/android' -Filter *.apk -Recurse |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }
          if (-not $apkOutput) { throw 'Android publish output missing expected .apk file.' }
          $apkName = "SurvivalGarden-$version-unsigned.apk"
          Rename-Item -Path $apkOutput.FullName -NewName $apkName -Force
          $renamedApkPath = Join-Path (Split-Path $apkOutput.FullName -Parent) $apkName
          Get-ChildItem 'artifacts/android' -Filter *.apk -Recurse |
            Where-Object { $_.FullName -ne $renamedApkPath } |
            Remove-Item -Force
          Write-Host "Renamed Android artifact to: $apkName"

      - name: Upload Windows artifact
        if: steps.check-artifacts.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.set-version.outputs.version }}-windows-unsigned
          path: artifacts/win/**
          if-no-files-found: error

      - name: Upload Android artifact
        if: steps.check-artifacts.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.set-version.outputs.version }}-android-unsigned
          path: artifacts/android/*.apk
          if-no-files-found: error

      - name: Upload metadata
        if: steps.check-artifacts.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.set-version.outputs.version }}-metadata
          path: artifacts/VERSION.txt
          if-no-files-found: error

      - name: Record build status
        id: build-status
        if: always()
        shell: pwsh
        run: |
          if ("${{ job.status }}" -ne "success") {
            echo "status=failed" >> $env:GITHUB_OUTPUT
          } elseif ("${{ steps.check-artifacts.outputs.exists }}" -eq "true") {
            echo "status=skipped" >> $env:GITHUB_OUTPUT
          } else {
            echo "status=success" >> $env:GITHUB_OUTPUT
          }

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## Build Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ needs.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ needs.build.outputs.build-status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.build.outputs.build-status }}" = "skipped" ]; then
            echo "Build artifacts already exist for this version." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build.outputs.build-status }}" = "success" ]; then
            echo "Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Artifacts uploaded with names prefixed by \`build-${{ needs.build.outputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build failed or status is unknown." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Next step: run **Sign Artifacts** with version \`${{ needs.build.outputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
